<!DOCTYPE html>
<!-- https://threejs.org/examples/webgl_animation_keyframes.html -->
<html>
  <head>
    <title>Kaizen Era Wrld</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link type="text/css" rel="stylesheet" href="main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="icon" type="image/png" href="favicon kzn era.png">
    <style>
      html, body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        color: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      
      /* Landing Page Styles */
      #landing-page {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 1;
        transition: opacity 0.8s ease-in-out;
      }
      
      #landing-page.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      
      .landing-container {
        display: flex;
        gap: 60px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        padding: 20px;
      }
      
      .brand-logo {
        width: 320px;
        height: 320px;
        background: white;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        position: relative;
        overflow: hidden;
      }
      
      .brand-logo::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(0,0,0,0.05) 0%, transparent 100%);
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      
      .brand-logo:hover {
        transform: scale(1.08) translateY(-8px);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.15);
      }
      
      .brand-logo:hover::before {
        opacity: 1;
      }
      
      .brand-logo-text {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #333;
        text-align: center;
        padding: 20px;
        transition: all 0.3s ease;
      }
      
      .brand-logo:hover .brand-logo-text {
        color: #000;
        transform: scale(1.05);
      }
      
      @media (max-width: 768px) {
        .landing-container {
          flex-direction: column;
          gap: 40px;
        }
        
        .brand-logo {
          width: 280px;
          height: 280px;
        }
        
        .brand-logo-text {
          font-size: 24px;
        }
      }
      
      /* 3D Container */
      #container {
        width: 100vw;
        height: 100vh;
        position: relative;
        z-index: 1;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
      }
      
      #container.visible {
        opacity: 1;
      }
      
      /* Back Button Styles */
      .back-button {
        position: fixed;
        top: 30px;
        left: 30px;
        z-index: 100;
        background: rgba(255, 255, 255, 0.95);
        border: none;
        border-radius: 12px;
        padding: 12px 28px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        display: none;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        transition: all 0.3s ease;
        color: #333;
      }
      
      .back-button:hover {
        background: rgba(255, 255, 255, 1);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      }
      
      .back-button.visible {
        display: block;
      }
      
      #info-panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 40vh;
        background: rgba(255,255,255,0.97);
        border-radius: 24px 24px 0 0;
        box-shadow: 0 -8px 32px rgba(0,0,0,0.22);
        overflow: hidden;
        z-index: 10;
        display: flex;
        flex-direction: column;
      }
      .info-content {
        padding: 0 10px 30px 10px;
        overflow-y: auto;
        height: 100%;
      }
      .section-title {
        font-size: 1.2em;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .roadmap-owners {
        display: flex;
        flex-direction: row;
        gap: 24px;
        width: 100vw;
        overflow-x: auto;
        align-items: center;
        justify-content: flex-start;
        position: relative;
      }
      .owner-card {
        min-width: 180px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.3s;
      }
      .owner-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #eee;
        margin-bottom: 8px;
      }
      .preorder-button {
        background: #000;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 20px;
        transition: all 0.3s ease;
      }
      .preorder-button:hover {
        background: #333;
        transform: translateY(-2px);
      }
      @media (min-width: 700px) {
        #info-panel {
          width: 340px;
          height: 90vh;
          left: auto;
          right: 20px;
          top: 20px;
          bottom: auto;
          border-radius: 10px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Landing Page -->
    <div id="landing-page">
      <div class="landing-container">
        <div class="brand-logo" id="brandA">
          <div class="brand-logo-text">LOGO BRAND A</div>
        </div>
        <div class="brand-logo" id="brandB">
          <div class="brand-logo-text">LOGO BRAND B</div>
        </div>
      </div>
    </div>
    
    <!-- 3D Container -->
    <div id="container"></div>
    
    <!-- Back Button -->
    <button class="back-button" id="backButton">← Torna alla Home</button>
    
    <script type="module">
      import * as THREE from './three.module.js';
      import { OrbitControls } from './OrbitControls.js';
      
      // Global variables
      let camera, renderer, controls;
      let currentScene = null;
      let sceneA = null;
      let sceneB = null;
      let currentBrand = null;
      const clock = new THREE.Clock();
      
      // Get DOM elements
      const landingPage = document.getElementById('landing-page');
      const container = document.getElementById('container');
      const backButton = document.getElementById('backButton');
      const brandA = document.getElementById('brandA');
      const brandB = document.getElementById('brandB');
      
      // Initialize renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);
      
      // Initialize camera with isometric-like perspective
      camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(15, 15, 15);
      
      // Initialize controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = false;
      controls.minDistance = 10;
      controls.maxDistance = 40;
      controls.maxPolarAngle = Math.PI / 2.2; // Prevent going below floor
      controls.mouseButtons.RIGHT = null;
      controls.mouseButtons.MIDDLE = null;
      
      // Function to create Building A (placeholder geometry)
      function createBuildingA() {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        
        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        // Add directional light with shadows
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);
        
        // Create floor
        const floorGeometry = new THREE.PlaneGeometry(30, 30);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
          color: 0xe8e8e8,
          roughness: 0.8,
          metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Create Building A - Modern tower with multiple levels
        const buildingGroup = new THREE.Group();
        
        // Base
        const baseGeometry = new THREE.BoxGeometry(4, 1, 4);
        const baseMaterial = new THREE.MeshStandardMaterial({ 
          color: 0xffffff,
          roughness: 0.3,
          metalness: 0.1
        });
        const base = new THREE.Mesh(baseGeometry, baseMaterial);
        base.position.y = 0.5;
        base.castShadow = true;
        base.receiveShadow = true;
        buildingGroup.add(base);
        
        // Main tower
        const towerGeometry = new THREE.BoxGeometry(3, 6, 3);
        const tower = new THREE.Mesh(towerGeometry, baseMaterial);
        tower.position.y = 4;
        tower.castShadow = true;
        tower.receiveShadow = true;
        buildingGroup.add(tower);
        
        // Top section
        const topGeometry = new THREE.BoxGeometry(2, 2, 2);
        const top = new THREE.Mesh(topGeometry, baseMaterial);
        top.position.y = 8;
        top.castShadow = true;
        top.receiveShadow = true;
        buildingGroup.add(top);
        
        // Add some detail cubes
        for (let i = 0; i < 3; i++) {
          const detailGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
          const detailMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xf5f5f5,
            roughness: 0.4,
            metalness: 0.3
          });
          const detail = new THREE.Mesh(detailGeometry, detailMaterial);
          detail.position.set(
            Math.cos(i * Math.PI * 2 / 3) * 2,
            2 + i * 1.5,
            Math.sin(i * Math.PI * 2 / 3) * 2
          );
          detail.castShadow = true;
          buildingGroup.add(detail);
        }
        
        scene.add(buildingGroup);
        
        return scene;
      }
      
      // Function to create Building B (placeholder geometry)
      function createBuildingB() {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        
        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        // Add directional light with shadows
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(-10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);
        
        // Create floor
        const floorGeometry = new THREE.PlaneGeometry(30, 30);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
          color: 0xe8e8e8,
          roughness: 0.8,
          metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Create Building B - Wider complex with connected sections
        const buildingGroup = new THREE.Group();
        
        // Left wing
        const leftWingGeometry = new THREE.BoxGeometry(2, 4, 3);
        const buildingMaterial = new THREE.MeshStandardMaterial({ 
          color: 0xffffff,
          roughness: 0.3,
          metalness: 0.1
        });
        const leftWing = new THREE.Mesh(leftWingGeometry, buildingMaterial);
        leftWing.position.set(-3, 2, 0);
        leftWing.castShadow = true;
        leftWing.receiveShadow = true;
        buildingGroup.add(leftWing);
        
        // Center tower
        const centerGeometry = new THREE.BoxGeometry(3, 7, 3);
        const center = new THREE.Mesh(centerGeometry, buildingMaterial);
        center.position.y = 3.5;
        center.castShadow = true;
        center.receiveShadow = true;
        buildingGroup.add(center);
        
        // Right wing
        const rightWing = new THREE.Mesh(leftWingGeometry, buildingMaterial);
        rightWing.position.set(3, 2, 0);
        rightWing.castShadow = true;
        rightWing.receiveShadow = true;
        buildingGroup.add(rightWing);
        
        // Top connector
        const connectorGeometry = new THREE.BoxGeometry(6, 0.5, 2);
        const connector = new THREE.Mesh(connectorGeometry, buildingMaterial);
        connector.position.y = 4.5;
        connector.castShadow = true;
        connector.receiveShadow = true;
        buildingGroup.add(connector);
        
        // Add decorative elements
        for (let i = 0; i < 4; i++) {
          const detailGeometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
          const detailMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xf5f5f5,
            roughness: 0.4,
            metalness: 0.3
          });
          const detail = new THREE.Mesh(detailGeometry, detailMaterial);
          detail.position.set(
            (i % 2 === 0 ? -2 : 2),
            1 + Math.floor(i / 2) * 2,
            1.5
          );
          detail.castShadow = true;
          buildingGroup.add(detail);
        }
        
        scene.add(buildingGroup);
        
        return scene;
      }
      
      // Function to show 3D scene
      function show3DScene(brand) {
        currentBrand = brand;
        
        // Fade out landing page
        landingPage.classList.add('fade-out');
        
        setTimeout(() => {
          landingPage.style.display = 'none';
          
          // Create scene if not exists
          if (brand === 'A' && !sceneA) {
            sceneA = createBuildingA();
          } else if (brand === 'B' && !sceneB) {
            sceneB = createBuildingB();
          }
          
          // Set current scene
          currentScene = brand === 'A' ? sceneA : sceneB;
          
          // Reset camera and controls
          camera.position.set(15, 15, 15);
          controls.target.set(0, 3, 0);
          controls.update();
          
          // Show container and back button
          container.classList.add('visible');
          backButton.classList.add('visible');
          
        }, 800);
      }
      
      // Function to return to landing page
      function returnToLanding() {
        // Fade out 3D scene
        container.classList.remove('visible');
        backButton.classList.remove('visible');
        
        setTimeout(() => {
          landingPage.style.display = 'flex';
          landingPage.classList.remove('fade-out');
          
          // Reset scene
          currentScene = null;
          currentBrand = null;
        }, 800);
      }
      
      // Event listeners for brand logos
      brandA.addEventListener('click', () => show3DScene('A'));
      brandB.addEventListener('click', () => show3DScene('B'));
      
      // Event listener for back button
      backButton.addEventListener('click', returnToLanding);
      
      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        
        const delta = clock.getDelta();
        
        if (currentScene) {
          controls.update();
          renderer.render(currentScene, camera);
        }
      }
      
      // Handle window resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      
      // Start animation loop
      animate();
    </script>
  </body>
</html>
